<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe3c4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="놀이 공부방">
<title>놀이 공부방</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@800;900&family=Noto+Serif+KR:wght@700&family=Gochi+Hand&display=swap">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<div class="app">
  <!-- START -->
  <section id="start" class="screen">
    <div class="gtabs" role="tablist" hidden>
      <button class="gtab" role="tab" data-g="stairs" aria-selected="true">🪜<br>계단</button>
      <button class="gtab" role="tab" data-g="balloon" aria-selected="false">🎈<br>풍선</button>
      <button class="gtab" role="tab" data-g="tower" aria-selected="false">🧱<br>블록</button>
      <button class="gtab" role="tab" data-g="match" aria-selected="false">🔗<br>짝 찾기</button>
    </div>
    <div class="acct" id="acct"><span class="acct-name" id="acctName">👤 손님</span><button class="acct-btn" id="btnStats" hidden>📈 통계</button><button class="acct-btn" id="btnRec" hidden>📊 내 기록</button><button class="acct-btn" id="btnLogin">로그인</button></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-k="word" aria-selected="true">영어</button>
      <button class="tab" role="tab" data-k="math" aria-selected="false">수학</button>
      <button class="tab" role="tab" data-k="frac" aria-selected="false">분수</button>
      <button class="tab" role="tab" data-k="clock" aria-selected="false">시계</button>
      <button class="tab" role="tab" data-k="money" aria-selected="false">돈</button>
      <button class="tab" role="tab" data-k="length" aria-selected="false">길이</button>
      <button class="tab" role="tab" data-k="hanja" aria-selected="false">한자</button>
    </div>
    <div class="hero"><canvas id="heroCv"></canvas><div class="skin" id="skin"><button data-s="basic" aria-pressed="false">기본</button><button data-s="xmas" aria-pressed="true">🎄</button></div><div class="xmas">Merry <b>Christmas</b> 🎄</div><h1 id="heroTitle">영어 무한계단</h1><button class="hnav prev" id="hPrev" aria-label="이전 게임">‹</button><button class="hnav next" id="hNext" aria-label="다음 게임">›</button><div class="hdots" id="hDots"></div><div class="best"><span>🏆</span><b id="bestTxt">0층</b></div></div>
    <div class="set" id="wordSet">
    <div class="label">공부할 알파벳 <button class="mini" id="allBtn">전체 해제</button></div>
    <div class="row" id="letters"></div>
    <div class="label">문제 종류</div>
    <div class="row" id="modes">
      <button class="tog wide" data-m="1" aria-pressed="false">그림 보고<br>단어</button>
      <button class="tog wide" data-m="2" aria-pressed="false">첫 글자<br>맞히기</button>
      <button class="tog wide" data-m="4" aria-pressed="false">🔊 듣고<br>그림</button>
      <button class="tog wide" data-m="3" aria-pressed="true">섞어서</button>
    </div>
    </div>
    <div class="set" id="mathSet" hidden>
      <div class="label">계산 종류 (여러 개 고르면 섞여요)</div>
      <div class="row" id="ops">
        <button class="tog op" data-op="+" aria-pressed="true">+</button>
        <button class="tog op" data-op="-" aria-pressed="true">−</button>
        <button class="tog op" data-op="x" aria-pressed="false">×</button>
        <button class="tog op" data-op="/" aria-pressed="false">÷</button>
      </div>
      <div class="label">난이도</div>
      <div class="row" id="levels">
        <button class="tog wide" data-lv="1" aria-pressed="false">쉬움<br><small>한 자리</small></button>
        <button class="tog wide" data-lv="2" aria-pressed="true">보통<br><small>두 자리</small></button>
        <button class="tog wide" data-lv="3" aria-pressed="false">어려움<br><small>두 자리끼리</small></button>
      </div>
      <div class="lvhint" id="lvHint"></div>
    </div>
    <div class="set" id="fracSet" hidden>
      <div class="label">문제 종류</div>
      <div class="row" id="fmodes">
        <button class="tog wide" data-fm="1" aria-pressed="false">그림 보고<br>분수</button>
        <button class="tog wide" data-fm="2" aria-pressed="false">분수 보고<br>그림</button>
        <button class="tog wide" data-fm="4" aria-pressed="false">크기가<br>같은 분수</button>
        <button class="tog wide" data-fm="3" aria-pressed="true">섞어서</button>
      </div>
      <div class="label">난이도</div>
      <div class="row" id="flevels">
        <button class="tog wide" data-flv="1" aria-pressed="true">쉬움<br><small>2·3·4등분</small></button>
        <button class="tog wide" data-flv="2" aria-pressed="false">보통<br><small>2~8등분</small></button>
      </div>
      <div class="lvhint">예) 피자를 4조각으로 똑같이 나눈 것 중 1조각 → <b>4분의 1</b></div>
    </div>
    <div class="set" id="genSet" hidden>
      <div class="label">문제 종류</div>
      <div class="row" id="gtypes"></div>
      <div class="label">난이도</div>
      <div class="row" id="glevels"></div>
      <div class="lvhint" id="gHint"></div>
    </div>
    <p class="rules" id="rules" hidden>정답을 맞히면 한 칸 올라가요. 위쪽 시간 막대가 다 줄어들면 떨어져요! 틀리면 시간이 줄어들어요.</p>
    <p class="hint" id="hint"></p>
    <button class="big push" id="startBtn">계단 오르기 ▶</button>
  </section>

  <!-- GAME -->
  <section id="game" hidden>
    <div class="sky">
      <canvas id="cv"></canvas>
      <div class="hud">
        <div class="floor"><span id="floorN">0</span><small>층</small></div>
        <div class="gauge" id="gauge"><i id="gaugeFill"></i></div>
        <div class="thearts" id="tHearts" hidden></div>
        <button class="quit" id="quitBtn">그만</button>
      </div>
      <div class="combo" id="combo"></div>
      <div id="bannerBox"></div>
      <div class="items" id="itemsS"></div><div class="itoast" id="toastS"></div>
    </div>
    <div class="quiz" id="quiz">
      <div class="q-top">
        <button class="pic" id="pic" aria-label="그림 누르면 단어 듣기"><img id="picImg" alt=""><span class="ear">🔊</span></button>
        <div class="expr" id="expr" hidden></div>
        <div class="q-info" id="qInfo">
          <div class="q-type" id="qType"></div>
          <div class="q-ko" id="qKo"></div>
          <div class="q-blank" id="qBlank" hidden></div>
        </div>
      </div>
      <div class="answers" id="answers"></div>
    </div>
  </section>

  <!-- BALLOON GAME -->
  <section id="bgame" hidden>
    <div class="bhud">
      <div class="hearts" id="hearts"></div>
      <div class="items inline small" id="itemsB"></div>
      <div class="bscore"><span id="bScore">0</span><small>점</small></div>
      <button class="quit2" id="bQuit">그만</button>
    </div>
    <div class="bprompt" id="bPrompt"></div>
    <div class="field" id="field">
      <div class="bcombo" id="bCombo"></div>
      <div class="bnote" id="bNote"></div>
      <div class="itoast" id="toastB"></div>
    </div>
  </section>

  <!-- MATCH GAME -->
  <section id="mgame" hidden>
    <div class="bhud">
      <div class="mround" id="mRound">1 / 3판</div>
      <div class="bscore"><span id="mTime">0:00</span></div>
      <button class="quit2" id="mQuit">그만</button>
    </div>
    <div class="mtitle"><span id="mTitle">짝을 찾아 선으로 이어요</span><div class="items inline" id="itemsM"></div></div>
    <div class="board" id="board">
      <div class="mcol" id="mLeft"></div>
      <div class="mcol" id="mRight"></div>
      <svg class="mlines" id="mLines"></svg>
      <div class="bnote" id="mNote"></div>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen result" hidden>
    <div id="stampBox"></div>
    <div class="res-floor" id="resFloor"></div>
    <div class="res-sub" id="resSub"></div>
    <div class="wrongs-t" id="wrongsT"></div>
    <div class="wrongs" id="wrongs"></div>
    <div class="btns">
      <button class="big" id="againBtn">다시 오르기 ↻</button>
      <button class="big alt" id="homeBtn">처음으로</button>
    </div>
  </section>
</div>

<div class="modal" id="loginModal" hidden>
  <div class="mbox">
    <h2>로그인</h2>
    <p class="msub">처음이면 바로 가입돼요. 다음부터는 같은 이름과 생일로 들어와요.</p>
    <label class="fld">이름 (별명도 돼요)<input id="lgName" maxlength="10" autocomplete="off"></label>
    <label class="fld">생일 4자리 (월일)<input id="lgBirth" inputmode="numeric" maxlength="8" placeholder="예) 0228" autocomplete="off"></label>
    <p class="hint" id="lgErr"></p>
    <button class="big" id="lgGo">시작하기</button>
    <button class="big alt" id="lgCancel">취소</button>
  </div>
</div>
<div class="modal" id="statsModal" hidden>
  <div class="mbox wide">
    <h2>📈 관리자 통계</h2>
    <div id="statsBody" class="stats">불러오는 중…</div>
    <button class="big alt" id="statsClose">닫기</button>
  </div>
</div>
<div class="modal" id="recModal" hidden>
  <div class="mbox">
    <h2 id="recTitle">내 기록</h2>
    <div class="rectbl" id="recBody"></div>
    <p class="myid" id="myId"></p>
    <button class="big alt" id="recClose">닫기</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js?v=2"></script>
<script src="js/data-words.js?v=2"></script>
<script src="js/data-hanja.js?v=2"></script>
<script src="js/game.js?v=2"></script>
<script src="js/skin.js?v=2"></script>
<script src="js/login.js?v=2"></script>
</body>
</html>
